<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% capture full_title %}{% if page.url == '/' %}{{ site.title }} | Sabana Grande, Puerto Rico{% else %}{{ page.title }} | {{ site.title }}{% endif %}{% endcapture %}
    <title>{{ full_title | strip }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_PR">
    <meta property="og:title" content="{{ full_title | strip | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/assets/images/aerial-community-enhanced.jpg' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#a92d23">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script>document.documentElement.classList.add('js');</script>
  </head>
  <body class="page-{{ page.nav_key | default: 'interior' }}">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    {% include header.html %}
    <main id="contenido">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
